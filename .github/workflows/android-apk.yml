# Builds an installable Android APK of the openGym mobile app on GitHub's runners.
# Run it from the Actions tab: "Android APK" -> "Run workflow". The APK shows up at the
# bottom of the finished run under "Artifacts" (named openGym-apk).
#
# Signing:
#   - With the three secrets below set, the APK is signed with YOUR key, so future builds
#     install as updates over the old one.
#   - Without them, a throwaway key is generated for this run. The APK installs fine, but a
#     later build signed with a different key can't be installed over it (uninstall first).
#
# Optional repo secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of your keystore file   (base64 -w0 my.keystore)
#   ANDROID_KEYSTORE_PASSWORD  keystore + key password
#   ANDROID_KEY_ALIAS          key alias (e.g. opengym)
name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # android/variables.gradle targets SDK 35; Gradle 8.11 needs Java 17+, docs say 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Vite production build with the mobile flags, then `cap sync` copies it into android/.
      - name: Build web app and sync into Android project
        run: npm run build:mobile
        working-directory: frontend

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon
        working-directory: frontend/android

      - name: Align and sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BT"

          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KS_PASS:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "Signing with the keystore from repo secrets."
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::No signing secrets set - using a throwaway key. Updates from other builds will not install over this APK."
            KS_PASS="opengym-temp-pass"
            KEY_ALIAS="opengym"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=openGym, O=openGym, C=US"
          fi
          export KS_PASS

          UNSIGNED=frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS \
            --out openGym.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose openGym.apk

      - uses: actions/upload-artifact@v4
        with:
          name: openGym-apk
          path: openGym.apk
          if-no-files-found: error
